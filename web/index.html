<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobomancer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AE%3C/text%3E%3C/svg%3E">
<script type="module" src="/src/main.ts"></script>
</head>
<body>

<header class="jb-top">
  <a class="homelink" href="/" title="Back to the platform home page">← Home</a>
  <div class="jb-modes" id="jb-modes">
    <button type="button" data-mode="scry" class="on"><span class="mg">🔮</span> Scry</button>
    <button type="button" data-mode="conjure"><span class="mg">🪄</span> Conjure</button>
  </div>
  <div class="jb-brand">
    <svg class="zodiac" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="zw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs><g fill="none" stroke="url(#zw)" stroke-width="1.25" stroke-linecap="round"><circle cx="12" cy="12" r="10.4"/><circle cx="12" cy="12" r="5.5"/><g><line x1="12" y1="1.6" x2="12" y2="6.5"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(30 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(60 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(90 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(120 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(150 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(180 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(210 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(240 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(270 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(300 12 12)"/><line x1="12" y1="1.6" x2="12" y2="6.5" transform="rotate(330 12 12)"/></g></g><circle cx="12" cy="12" r="1.6" fill="url(#zw)"/></svg>
    <span class="jb-name">Jobomancer</span>
  </div>
</header>

<main class="jb-body">
  <div class="status" id="status"></div>
  <div class="jb-live" id="runview" hidden aria-live="polite">
    <span class="live-pulse" aria-hidden="true"></span>
    <span class="live-phase" id="run-title">Starting…</span>
    <span class="live-count"><b class="mono" id="live-done">0</b> / <span class="mono" id="live-total">0</span></span>
    <span class="live-track"><i id="live-bar"></i></span>
    <span class="live-mode" id="run-note" hidden>Live</span>
    <span class="live-spend mono" id="live-spend">$0.00 / $5.00</span>
  </div>
  <div id="scry-root"></div>
  <div id="conjure-root" hidden></div>
</main>

<!-- Search popover: field, locations, and keep-filters. Opened by "New search"; its own
     Run search executes the scan. -->
<div class="search-pop" id="search-pop" hidden>
  <div class="sp-head"><span>New search</span><button type="button" class="sp-close" id="sp-close" aria-label="Close">✕</button></div>
  <div class="sp-body">
    <div class="sp-note">Scans LinkedIn + Indeed (1,000 each). These narrow what's kept; results land in Scry.</div>
    <label class="sp-field"><span>Field</span><div class="chipselect" id="fields"></div></label>
    <label class="sp-field"><span>Locations</span><div class="chipselect" id="locsel"></div></label>
    <label class="sp-row"><span>Remote anywhere</span><input type="checkbox" id="remote_ok" checked></label>
    <label class="sp-row"><span>Max age (days)</span><input type="number" id="max_age_days" min="0" value="30"></label>
    <label class="sp-row"><span>Min salary ($)</span><input type="number" id="min_salary" min="0" step="1000" value="150000"></label>
    <label class="sp-row"><span>Min score (0–1)</span><input type="number" id="min_score" min="0" max="1" step="0.05" value="0.5"></label>
    <label class="sp-row"><span>Include likely-ghosts</span><input type="checkbox" id="include_ghosts"></label>
    <label class="sp-row"><span>Estimate missing pay</span><input type="checkbox" id="estimate_salary" checked></label>
    <button type="button" class="primary sp-run" id="run">▶&nbsp;&nbsp;Run search</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

</body>
</html>
